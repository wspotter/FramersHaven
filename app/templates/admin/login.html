<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | Printery Framing Studio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f1ea;
      color: #1f2933;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      width: min(100%, 380px);
      background: #fff;
      border: 1px solid #d8d2c8;
      border-radius: 8px;
      box-shadow: 0 16px 44px rgba(31, 41, 51, 0.13);
      padding: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      line-height: 1.2;
    }
    p {
      margin: 0 0 22px;
      color: #59636e;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #b9c0c8;
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 6px;
      background: #1f2933;
      color: #fff;
      padding: 12px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .error {
      margin: 0 0 18px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #fff0f0;
      color: #8a1f1f;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Admin Login</h1>
    <p>Sign in to manage orders, customers, pricing, and shop settings.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{ next }}" />
      <label for="email">Email or Username</label>
      <input id="email" name="email" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign In</button>
    </form>
  </main>
</body>
</html>
